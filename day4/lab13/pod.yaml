apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
spec:
  containers:
  - name: mysql-container
    image: mysql:8.0
    # ... (env variables from before) ...
    
    # 1. This is where the container sees the storage
    volumeMounts:
    - name: log-storage
      mountPath: /var/log/mysql  # MySQL logs usually go here
      
  # 2. This links the Pod to the PVC you created
  volumes:
  - name: log-storage
    persistentVolumeClaim:
      claimName: log-pvc

  
