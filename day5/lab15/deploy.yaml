apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      tolerations:
      - key: "node"
        operator: "Equal"
        value: "worker"
        effect: "NoSchedule"
      containers:
      - name: nodejs-container 
        image: tokamohsen2001/ivolve-app:v1
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: config
              key: DB_HOST
        - name: DB_USER
          valueFrom: 
            configMapKeyRef:
              name: config
              key: DB_USER
        - name: DB_PASSWORD 
          valueFrom:
            secretKeyRef:
              name: service
              key: DB_PASSWORD
        volumeMounts:
          - name: app-storage
            mountPath: /app/logs
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: nodejs-pvc
